name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  artifact-check:
    name: Clean clone, install and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One version, not a range. The suite anchors a prediction digest, and
        # the same lockfile produces a different one on 3.10 than on 3.12 --
        # the engines agree bitwise within a version and disagree across them.
        # Testing a range we do not reproduce results on asserts a support we
        # do not have.
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install the package
        run: pip install -e . --no-deps

      - name: Import from outside the repository root
        run: |
          cd "$RUNNER_TEMP"
          python -c "
          from core.validation import TemporalValidator
          from core.paradigm_registry import discover_paradigms
          paradigms = sorted(discover_paradigms())
          print('discovered paradigms:', paradigms)
          assert set(paradigms) >= {'sql_engine', 'dataframe_lib', 'task_graph'}, paradigms
          "

      - name: Tests
        run: pytest -q

      - name: Documented entrypoint
        run: python pipeline.py --help

      - name: Anti-leakage gate, negative validation
        run: python scripts/validation/leakage_injection.py --quick
